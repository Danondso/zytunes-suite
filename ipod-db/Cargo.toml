[package]
name = "ipod-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Pure Rust iTunesDB parser and writer for classic iPod devices"
license = "MIT"

[dependencies]
byteorder = "1"
encoding_rs = "0.8"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
