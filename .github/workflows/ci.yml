name: CI

on:
  push:
    branches: [main, master]
  # No branch filter on pull_request: stacked PRs target their parent
  # feature branch until it merges, and they need CI too.
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The change-detection gate reads the PR's changed-file list via the GitHub
# API (dorny/paths-filter), which needs `pull-requests: read`. The default
# workflow token is contents-only, so grant it explicitly. Everything else
# only needs to read the repo to check out.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Change-detection gate: is anything other than Markdown in the diff?
  # Docs-only pushes/PRs skip every heavy job below (needless runner time).
  # We gate with a per-job `if:` rather than a top-level `paths-ignore` on
  # purpose: `paths-ignore` skips the WHOLE workflow, so a required check
  # never reports and a docs-only PR deadlocks waiting on it. A job skipped
  # via `if:` still reports its check (as "skipped"), which branch
  # protection treats as passing — so the merge stays unblocked.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` is true when any changed file is NOT a .md file. When
          # the diff is Markdown-only, no file matches the negated pattern
          # and `code` is false, so the jobs below skip. If the base can't
          # be resolved (e.g. first push), the action treats everything as
          # changed → `code` true → jobs run, which is the safe direction.
          filters: |
            code:
              - '!**/*.md'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  fmt:
    needs: changes
    # Skip ONLY when the gate positively reported docs-only (`code == false`).
    # Any other state — code true, or the gate itself failing/erroring
    # (empty output) — runs the job, so a broken gate fails safe toward
    # running CI rather than deadlocking required checks. `!cancelled()`
    # lets this evaluate even when `needs.changes` didn't succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    # Skip ONLY when the gate positively reported docs-only (`code == false`).
    # Any other state — code true, or the gate itself failing/erroring
    # (empty output) — runs the job, so a broken gate fails safe toward
    # running CI rather than deadlocking required checks. `!cancelled()`
    # lets this evaluate even when `needs.changes` didn't succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libasound2-dev libdiscid-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libdiscid
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: changes
    # Skip ONLY when the gate positively reported docs-only (`code == false`).
    # Any other state — code true, or the gate itself failing/erroring
    # (empty output) — runs the job, so a broken gate fails safe toward
    # running CI rather than deadlocking required checks. `!cancelled()`
    # lets this evaluate even when `needs.changes` didn't succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libasound2-dev libdiscid-dev
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        # The rust-cache'd build-script outputs of the *-sys crates pin
        # versioned Homebrew Cellar paths (e.g. .../libdiscid/0.6.5/lib).
        # When the runner image's formula bumps, the linker dies on the
        # stale path ("library 'discid' not found") because the cached
        # fingerprint never re-runs the build script. Clean exactly those
        # crates so pkg-config re-resolves against what brew installed.
        run: |
          brew install libdiscid
          cargo clean -p discid-sys -p libusb1-sys
      - run: cargo test --workspace
      - name: Doc warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  coverage:
    needs: changes
    # Skip ONLY when the gate positively reported docs-only (`code == false`).
    # Any other state — code true, or the gate itself failing/erroring
    # (empty output) — runs the job, so a broken gate fails safe toward
    # running CI rather than deadlocking required checks. `!cancelled()`
    # lets this evaluate even when `needs.changes` didn't succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libasound2-dev libdiscid-dev
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  flutter:
    needs: changes
    # Same fail-safe as the Rust jobs: skip only when the gate positively
    # reported "no mobile change". Empty/broken gate output still runs.
    if: ${{ !cancelled() && needs.changes.outputs.mobile != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  security:
    needs: changes
    # Skip ONLY when the gate positively reported docs-only (`code == false`).
    # Any other state — code true, or the gate itself failing/erroring
    # (empty output) — runs the job, so a broken gate fails safe toward
    # running CI rather than deadlocking required checks. `!cancelled()`
    # lets this evaluate even when `needs.changes` didn't succeed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  # Single required check for the `main` ruleset. Matrix jobs report as
  # `clippy (macos-latest)` when they run and as `clippy` when skipped, so
  # requiring the matrix names deadlocks docs-only PRs. This job always
  # reports as `CI` and treats `skipped` as success (the change-detection
  # gate above) while failing on any `failure`/`cancelled`.
  ci:
    name: CI
    needs: [changes, fmt, clippy, test, coverage, flutter, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          failed = []
          for name, data in needs.items():
              result = data.get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed.append(f"{name}={result}")
          if failed:
              print("required jobs did not pass:", ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY
