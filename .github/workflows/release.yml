name: Release

# Tag-only releases. main is protected (changes go through a squash-merged
# PR with CI), and a push made with GITHUB_TOKEN can neither bypass that nor
# open a PR that runs CI. So the version-bump commit never lands on main: it
# is made on top of the main commit being released, tagged `v<version>`, and
# only the tag is pushed (the tag ruleset allows creating tags). The tags,
# not app/Cargo.toml on main, are the source of truth for the version; the
# binaries are built from the tagged commit, so they report it.

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two merges in quick succession must not both compute the same next tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_version: ${{ steps.bump.outputs.new_version }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      base: ${{ steps.bump.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump from commits
        id: bump
        run: |
          # Release tags sit on bump commits off main, so `git describe`
          # (which only sees tags reachable from HEAD) cannot find them.
          # Take the highest v* tag; the main commit it released is its
          # parent, and everything on main after that is unreleased.
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            BASE=""
            RANGE="HEAD"
            # First tagged release: start from the hand-set version.
            OLD_VERSION=$(grep '^version' app/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          else
            BASE=$(git rev-parse "${PREV_TAG}^")
            RANGE="${BASE}..HEAD"
            OLD_VERSION="${PREV_TAG#v}"
          fi
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # The project ships as an alpha (single-user, not battle-tested),
          # so versions carry a "-alpha" pre-release suffix. Strip it for
          # arithmetic and re-apply it when writing the new version.
          OLD_CORE="${OLD_VERSION%-*}"

          # Analyze conventional commits to determine bump type.
          # `tformat:` (not `format:`) terminates every line with `\n` so
          # `read` sees the final commit subject. `format:` omits the
          # trailing newline, which silently drops single-commit ranges
          # (the loop body never runs for the only commit, BUMP stays
          # empty, and the release is skipped).
          BUMP=""
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE "BREAKING[ -]CHANGE|^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              BUMP="minor"
            elif [ -z "$BUMP" ] && echo "$msg" | grep -qE "^(fix|perf)(\(.+\))?:"; then
              BUMP="patch"
            fi
          done < <(git log "$RANGE" --pretty=tformat:"%s" 2>/dev/null)

          if [ -z "$BUMP" ]; then
            echo "No version-bumping commits found (feat/fix/perf/BREAKING). Skipping release."
            echo "bump=" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_CORE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha"

          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists. Skipping."
            echo "bump=" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP ($OLD_VERSION -> $NEW_VERSION)"

  tag:
    needs: check-version
    if: needs.check-version.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Commit the version bump off main and push its tag
        env:
          NEW: ${{ needs.check-version.outputs.new_version }}
        run: |
          # Set the package version outright (main's Cargo.toml may lag the
          # tags), and the matching Cargo.lock entry so `--locked` builds.
          sed -i "0,/^version = \".*\"/s//version = \"$NEW\"/" app/Cargo.toml
          sed -i "/^name = \"zytunes\"$/{n;s/^version = \".*\"/version = \"$NEW\"/}" Cargo.lock
          grep -q "^version = \"$NEW\"" app/Cargo.toml
          grep -A1 '^name = "zytunes"$' Cargo.lock | grep -q "^version = \"$NEW\""

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$NEW"
          git tag "v$NEW"
          git push origin "v$NEW"

  build:
    needs: [check-version, tag]
    if: needs.check-version.outputs.bump != ''
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.check-version.outputs.new_version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libasound2-dev libdiscid-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        # Same Cellar-path trap as CI: rust-cache can replay a stale
        # discid-sys/libusb1-sys link-search after brew bumps the formula.
        run: |
          brew install libdiscid
          cargo clean -p discid-sys -p libusb1-sys

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zytunes dist/zytunes-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/zytunes-tui dist/zytunes-tui-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: notes
        env:
          BASE: ${{ needs.check-version.outputs.base }}
          PREV_TAG: ${{ needs.check-version.outputs.prev_tag }}
          NEW: ${{ needs.check-version.outputs.new_version }}
        run: |
          # The commits merged to main since the previous release, up to the
          # main commit this run released (not the bump commit on the tag).
          if [ -z "$BASE" ]; then
            RANGE="$GITHUB_SHA"
          else
            RANGE="${BASE}..${GITHUB_SHA}"
          fi
          {
            echo "notes<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=tformat:"- %s" | grep -E "^- (feat|fix|perf|refactor|docs)" || true
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${NEW}"
            fi
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ needs.check-version.outputs.new_version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "v$NEW" --verify-tag --title "v$NEW" --notes "$NOTES" dist/*
