[workspace]
members = [".", "zune-mtp"]

[package]
name = "zytunes"
version = "0.6.0"
edition = "2021"
rust-version = "1.87"
description = "A CLI tool for syncing music to a Microsoft Zune 30 on macOS"
license = "MIT"

[dependencies]
rusb = "0.9"
quick-xml = "0.37"
percent-encoding = "2"
ratatui = "0.30"
crossterm = "0.28"
throbber-widgets-tui = "0.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zune-mtp = { path = "zune-mtp" }
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.19", default-features = true, features = ["symphonia-aac", "symphonia-isomp4"] }

[[bin]]
name = "zytunes"
path = "src/main.rs"

[[bin]]
name = "zytunes-tui"
path = "src/tui/main.rs"
