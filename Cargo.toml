[workspace]
members = [".", "zune-mtp", "ipod-db"]

[package]
name = "zytunes"
version = "1.2.0-alpha"
edition = "2021"
rust-version = "1.94"
description = "A CLI tool for syncing music to a Microsoft Zune 30 on macOS"
license = "MIT"

[dependencies]
rusb = "0.9"
ratatui = "0.30"
crossterm = "0.28"
throbber-widgets-tui = "0.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zune-mtp = { path = "zune-mtp" }
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
mp3lame-encoder = "0.2"
rodio = { version = "0.22", default-features = true, features = [
    "symphonia-aac", "symphonia-isomp4", "symphonia-alac",
    "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-mp3",
] }
symphonia = { version = "0.5", features = ["all"] }
rayon = "1"
serde_json = "1"
unicode-width = "0.2"

[[bin]]
name = "zytunes"
path = "src/main.rs"

[[bin]]
name = "zytunes-tui"
path = "src/tui/main.rs"
