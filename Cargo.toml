[workspace]
members = [".", "zune-mtp", "ipod-db"]

[package]
name = "zytunes"
version = "2.3.0-alpha"
edition = "2021"
rust-version = "1.95"
description = "A CLI + TUI for syncing music to Microsoft Zune and Apple iPod Classic on macOS and Linux"
license = "MIT"

[dependencies]
rusb = "0.9"
ratatui = "0.30"
crossterm = "0.28"
throbber-widgets-tui = "0.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zune-mtp = { path = "zune-mtp" }
ipod-db = { path = "ipod-db" }
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
mp3lame-encoder = "0.2"
rodio = { version = "0.22", default-features = true, features = [
    "symphonia-aac", "symphonia-isomp4", "symphonia-alac",
    "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-mp3",
] }
symphonia = { version = "0.5", features = ["all"] }
rusty-chromaprint = "0.3"
base64 = "0.22"
rayon = "1"
serde_json = "1"
unicode-width = "0.2"
arboard = { version = "3", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
sha1 = "0.10"

[features]
# Exposes the TUI modules through the lib crate so integration tests can
# drive App against ratatui's TestBackend without touching the real terminal
# or background worker. Off by default — release builds of the binary do not
# need it.
tui-testing = []

[dev-dependencies]
insta = "1"

[[bin]]
name = "zytunes"
path = "src/main.rs"

[[bin]]
name = "zytunes-tui"
path = "src/tui/main.rs"
