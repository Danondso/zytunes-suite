[package]
name = "zytunes"
version = "3.0.0-alpha"
edition = "2021"
rust-version = "1.98"
description = "A CLI + TUI for syncing music to Microsoft Zune and Apple iPod Classic on macOS and Linux"
license = "MIT"
default-run = "zytunes"

[dependencies]
rusb = "0.9"
# PR_SET_PDEATHSIG for stem-engine children (Linux): the engine must die
# with the TUI or an orphan wedges the HuggingFace model-download lock.
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"
throbber-widgets-tui = "0.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zune-mtp = { path = "../zune-mtp" }
ipod-db = { path = "../ipod-db" }
id3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
mp3lame-encoder = "0.2"
rodio = { version = "0.22", default-features = true, features = [
    "symphonia-aac", "symphonia-isomp4", "symphonia-alac",
    "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-mp3",
] }
# Our own decode path (transcode, fingerprint). rodio still pulls symphonia
# 0.5 for playback with only the codec features it enables above. Formats
# match what the library scans (dirlib::AUDIO_EXTENSIONS); `all` would add
# CAF and MKV, which nothing here opens. `opt-simd` stays off: its FFT path
# changes AAC/Vorbis output in the last float bits, which moves transcodes.
symphonia = { version = "0.6", default-features = false, features = [
    "aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "aiff", "isomp4", "ogg", "wav", "all-meta",
] }
rusty-chromaprint = "0.3"
base64 = "0.22"
rayon = "1"
serde_json = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
arboard = { version = "3", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
sha1 = "0.11"
discid = "0.7"

[features]
# Exposes the TUI modules through the lib crate so integration tests can
# drive App against ratatui's TestBackend without touching the real terminal
# or background worker. Off by default — release builds of the binary do not
# need it.
tui-testing = []

[dev-dependencies]
insta = "1"

[[bin]]
name = "zytunes"
path = "src/main.rs"

[[bin]]
name = "zytunes-tui"
path = "src/tui/main.rs"
