[package]
name = "zune-mtp"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native MTP/MTPZ library for USB device communication (macOS IOKit, Linux libusb)"
license = "MIT"

[dependencies]
aes = "0.8"
cbc = "0.1"
cmac = "0.7"
cipher = "0.4"
num-bigint = "0.4"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
rusb = "0.9"

[dev-dependencies]
tempfile = "3"
