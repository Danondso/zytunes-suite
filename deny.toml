[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste crate unmaintained — transitive via lofty, no patched version
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # target-lexicon (transitive via discid → system-deps)
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (transitive via ureq, used by MusicBrainz client)
    "ISC",
    "LGPL-2.1-or-later", # discid-sys bindings to libdiscid C library
    "LGPL-3.0", # mp3lame-encoder / mp3lame-sys (audio transcoding, dynamic-linked)
    "LGPL-3.0-or-later", # discid Rust crate
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
