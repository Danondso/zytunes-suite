[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste crate unmaintained — transitive dep, no alternative yet
    "RUSTSEC-2026-0097", # rand unsoundness only triggers with a custom logger that calls into rand from inside log::log!() — not our pattern
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "LGPL-3.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
